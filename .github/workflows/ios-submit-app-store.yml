name: iOS - Submit App Store Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to submit"
        required: true
        default: "1.2.1"
      build:
        description: "Build number to attach and submit"
        required: true
        default: "16"
      submit:
        description: "Submit to App Review after attaching the build"
        type: boolean
        default: true
      review_submission_id:
        description: "Existing review submission ID to submit, if App Store Connect already created one"
        required: false
        default: ""
      cancel_active:
        description: "Cancel any active review submission first (replace what's in the queue)"
        type: boolean
        default: false
      whats_new_file:
        description: "Repo path to a plain-text What's New file to set on the version"
        required: false
        default: ""
      keywords:
        description: "App Store keywords (comma-separated, <=100 chars) to set on the version"
        required: false
        default: ""

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build }}
      SUBMIT_FOR_REVIEW: ${{ inputs.submit }}
      REVIEW_SUBMISSION_ID: ${{ inputs.review_submission_id }}
      CANCEL_ACTIVE_SUBMISSION: ${{ inputs.cancel_active }}
      WHATS_NEW_FILE: ${{ inputs.whats_new_file }}
      KEYWORDS: ${{ inputs.keywords }}
      BUNDLE_ID: com.colecantcode.ollamacloud
      MAX_WAIT_MINUTES: "30"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Attach build and submit for review
        run: |
          if [ -n "$WHATS_NEW_FILE" ]; then
            WHATS_NEW=$(cat "$WHATS_NEW_FILE")
            export WHATS_NEW
          fi
          node scripts/submit_app_store_version.mjs
