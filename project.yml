name: OllamaCloud
options:
  bundleIdPrefix: com.colecantcode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1

targets:
  OllamaCloud:
    type: application
    platform: iOS
    sources:
      - OllamaCloud/Sources
      - OllamaCloud/Assets.xcassets
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud
        INFOPLIST_KEY_CFBundleDisplayName: SEER
        INFOPLIST_KEY_CFBundleName: SEER
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OllamaCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OllamaCloud/Tests
    dependencies:
      - target: OllamaCloud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud.tests
        GENERATE_INFOPLIST_FILE: true
