name: OllamaCloud
options:
  bundleIdPrefix: com.colecantcode
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.6.4"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B3DB33R8JN

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.11.0

targets:
  OllamaCloud:
    type: application
    platform: iOS
    sources:
      - OllamaCloud/Sources
      - OllamaCloud/Assets.xcassets
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud
        INFOPLIST_KEY_CFBundleDisplayName: SEER
        INFOPLIST_KEY_CFBundleName: SEER
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SEER uses the microphone to let you dictate messages by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "SEER uses speech recognition to turn your dictation into text."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: SEER
        # Tests do `@testable import OllamaCloud`; without this the module
        # name follows PRODUCT_NAME (SEER), like the macOS target already
        # handles.
        PRODUCT_MODULE_NAME: OllamaCloud
        # Modern identity name; without this XcodeGen emits the legacy
        # "iPhone Developer" default.
        CODE_SIGN_IDENTITY: "Apple Development"
    scheme:
      testTargets:
        - OllamaCloudTests

  OllamaCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OllamaCloud/Tests
    dependencies:
      - target: OllamaCloud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud.tests
        GENERATE_INFOPLIST_FILE: true
        # The app target's PRODUCT_NAME is SEER; XcodeGen derives TEST_HOST
        # from the target name, which points at a nonexistent OllamaCloud.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SEER.app/SEER"

  OllamaCloudMac:
    type: application
    platform: macOS
    sources:
      - OllamaCloud/Sources
      - OllamaCloud/Assets.xcassets
    entitlements:
      path: OllamaCloud/OllamaCloudMac.entitlements
    dependencies:
      - package: MarkdownUI
      - package: MCP
    settings:
      base:
        PRODUCT_NAME: SEER
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud.mac
        PRODUCT_MODULE_NAME: OllamaCloud
        INFOPLIST_KEY_CFBundleDisplayName: SEER
        INFOPLIST_KEY_CFBundleName: SEER
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - OllamaCloudMacTests

  OllamaCloudMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OllamaCloud/Tests
    dependencies:
      - target: OllamaCloudMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colecantcode.ollamacloud.mac.tests
        GENERATE_INFOPLIST_FILE: true
